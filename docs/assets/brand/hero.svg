<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">Unity Editor Agent</title>
  <desc id="desc">An AI agent inside Unity Editor. Chat, build and iterate with local or cloud models. Illustration of scene, code and Play Mode tools connected to a project.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0a1020"/><stop offset="1" stop-color="#15283b"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#a5b4ff"/><stop offset="1" stop-color="#61e7c4"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#3c8d88" stop-opacity=".2"/><stop offset="1" stop-color="#3c8d88" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0v32" fill="none" stroke="#7b99b5" stroke-opacity=".09"/></pattern>
    <clipPath id="bounds"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="400" fill="url(#background)"/>
    <rect x="700" width="580" height="400" fill="url(#grid)"/>
    <ellipse cx="1000" cy="205" rx="290" ry="240" fill="url(#glow)"/>
    <path d="M756 72v256" stroke="#456071" stroke-opacity=".4"/>
    <text x="64" y="70" fill="#76e3c5" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="3.4">YOUR AI, INSIDE UNITY</text>
    <text x="60" y="159" fill="#f4f7ff" font-family="Arial, sans-serif" font-size="69" font-weight="700" letter-spacing="-2.4">Unity Editor</text>
    <text x="60" y="245" fill="#f4f7ff" font-family="Arial, sans-serif" font-size="88" font-weight="700" letter-spacing="-3">Agent<tspan fill="#76e3c5">.</tspan></text>
    <text x="64" y="296" fill="#bdcbd9" font-family="Arial, sans-serif" font-size="25">Chat. Build. Iterate.</text>
    <g font-family="Arial, sans-serif" font-size="14" fill="#c8d7e7">
      <rect x="64" y="329" width="89" height="30" rx="15" fill="#1b3041" stroke="#31485c"/><text x="84" y="349">Unity 6</text>
      <rect x="163" y="329" width="169" height="30" rx="15" fill="#1b3041" stroke="#31485c"/><text x="182" y="349">Local + cloud models</text>
      <rect x="342" y="329" width="153" height="30" rx="15" fill="#1b3041" stroke="#31485c"/><text x="361" y="349">Editable project files</text>
    </g>
    <g fill="none" stroke="#688698" stroke-width="1.5">
      <path d="M881 114l104 68m124-63-66 63m-115 136 62-65"/>
      <circle cx="1015" cy="207" r="92" stroke-dasharray="3 8" stroke-opacity=".45"/>
    </g>
    <g stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round">
      <path d="m1015 138 63 36v74l-63 36-63-36v-74z" fill="#1a3547"/>
      <path d="m952 174 63 37 63-37m-63 37v73" fill="none"/>
      <path d="m986 172 29-16 29 16-29 17z" fill="#79a0c2" fill-opacity=".3" stroke-width="1.3"/>
    </g>
    <g font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">
      <rect x="803" y="72" width="112" height="64" rx="14" fill="#132535" stroke="#3e596f"/>
      <path d="m824 91 8-4 8 4v9l-8 5-8-5zm0 0 8 5 8-5m-8 5v9" fill="none" stroke="#a3b8fa" stroke-width="1.5"/>
      <text x="852" y="103" fill="#dce7f4">SCENE</text>
      <rect x="1093" y="81" width="112" height="64" rx="14" fill="#132535" stroke="#3e596f"/>
      <path d="m1111 101 12 7-12 7z" fill="#76e3c5"/>
      <text x="1134" y="113" fill="#dce7f4">PLAY</text>
      <rect x="833" y="299" width="126" height="64" rx="14" fill="#132535" stroke="#3e596f"/>
      <text x="850" y="336" fill="#a3b8fa" font-size="19">{ }</text><text x="887" y="335" fill="#dce7f4">CODE</text>
    </g>
    <circle cx="1015" cy="211" r="4" fill="#79e6c8"/>
  </g>
  <rect x=".5" y=".5" width="1279" height="399" rx="23.5" fill="none" stroke="#345066" stroke-opacity=".55"/>
</svg>
